# Lint, build and test EasyQM on every push and pull request.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # Pinned: the config enables preview rules, which change between ruff releases.
      - run: python -m pip install ruff==0.16.3
      - run: ruff check --output-format=github .

  build-and-test:
    name: Build and test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12', '3.13']
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen # no display on the runners
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # versioningit reads the version from the git tags

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel with the test dependencies
        run: python -m pip install "$(ls dist/*.whl)[dev]"

      - name: Run the tests
        run: python -m pytest -n auto
